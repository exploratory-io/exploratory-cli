name: Bug report
description: Something in the expl command line does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste tokens, passwords or customer data.
  - type: input
    id: version
    attributes:
      label: Output of `expl --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version (`node --version`)
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: How was expl installed?
      description: The output of `expl --version` does not say, so please tell us.
      options:
        - Bundled with Exploratory Desktop
        - npm (npx or npm install -g)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: verbose
    attributes:
      label: Output with --verbose (optional)
      description: Tokens are not printed, but check the text before you paste it.
      render: text
    validations:
      required: false
